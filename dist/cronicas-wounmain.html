:root {
  --u: 2px;
  --ink: #0b1d22; --panel: rgba(8, 26, 31, .94); --panel2: #12333a; --line: #e9c46a; --line2: #6d5a2e;
  --gold: #e9c46a; --gold2: #f6dd9a; --coral: #ff7a85; --teal: #2fb3a8; --aqua: #7fe0c4; --violet: #b98cff; --sky: #6fc3ff;
  --paper: #fbf3e2; --text: #f4ecd8; --muted: #a9bbba; --dim: #6f8a88;
  --red: #e5484d; --orange: #f08c3a; --yellow: #f2c94c; --green: #46c37b;
  --fpx: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --ftx: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --kanas: repeating-linear-gradient(90deg, #c2457a 0 6px, #f2c14e 6px 12px, #2fb3a8 12px 18px, #f3ead8 18px 21px, #e76f51 21px 27px, #1d1226 27px 30px);
  --fs: max(13px, calc(var(--u) * 6.6));
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05090b; overflow: hidden; color: var(--text); font-family: var(--ftx); }
body { touch-action: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
[hidden] { display: none !important; }
kbd { font-family: var(--fpx); font-size: .85em; background: var(--gold); color: #1d1226; padding: .05em .45em; border-radius: 3px; box-shadow: 0 2px 0 #8a6a2a; }
.ico { width: 1.2em; height: 1.2em; image-rendering: pixelated; vertical-align: -0.22em; }

#game { position: absolute; overflow: hidden; background: #000; }
#game > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#screen { image-rendering: auto; }
#dof { image-rendering: auto; filter: blur(calc(var(--u) * 1.6)) saturate(1.05); pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.65) 10%, transparent 26%, transparent 80%, rgba(0,0,0,.7) 94%, #000 100%);
  mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.65) 10%, transparent 26%, transparent 80%, rgba(0,0,0,.7) 94%, #000 100%); }
#fx { mix-blend-mode: screen; pointer-events: none; }
#over { pointer-events: none; }
#grade { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; transition: background 1s; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(6, 3, 14, .42) 100%); }

/* ── Paneles ── */
.pnl { background: var(--panel); border: max(1px, var(--u)) solid var(--line); border-radius: calc(var(--u) * 2);
  box-shadow: 0 0 0 max(1px, var(--u)) #1a0f22, inset 0 0 0 max(1px, var(--u)) rgba(255, 255, 255, .05), 0 calc(var(--u) * 5) calc(var(--u) * 14) rgba(0, 0, 0, .5); position: relative; }
.pnl::before { content: ''; position: absolute; left: calc(var(--u) * 6); right: calc(var(--u) * 6); top: calc(var(--u) * -2.5); height: max(2px, calc(var(--u) * 2)); background: var(--kanas); background-size: calc(var(--u) * 15) 100%; border-radius: 2px; }
.btn { font-family: var(--fpx); font-weight: 600; letter-spacing: .02em; background: linear-gradient(#1f4c52, #163b40); border: max(1px, var(--u)) solid #7fb8a8; color: var(--text);
  padding: .5em 1em; border-radius: calc(var(--u) * 1.5); box-shadow: 0 max(2px, calc(var(--u) * 1.5)) 0 #0a2226; transition: transform .08s, background .15s, box-shadow .15s; }
.btn:hover, .btn.sel { background: linear-gradient(#2c6a6e, #1f5156); border-color: var(--gold); box-shadow: 0 max(2px, calc(var(--u) * 1.5)) 0 #0a2226, 0 0 calc(var(--u) * 6) rgba(233, 196, 106, .35); }
.btn:active { transform: translateY(1px); }
.btn.gold { background: linear-gradient(#f2d27a, #d9a93a); color: #2a1a0e; border-color: #fff1c0; box-shadow: 0 max(2px, calc(var(--u) * 1.5)) 0 #7a5418; }
.btn.gold:hover, .btn.gold.sel { background: linear-gradient(#ffe39a, #e9b84a); }
.btn.ghost { background: transparent; border-color: rgba(127, 184, 168, .5); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: .35em; font-family: var(--fpx); font-size: .82em; padding: .15em .6em; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18); white-space: nowrap; }

/* ── HUD ── */
#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--fpx); font-size: max(10px, calc(var(--u) * 5.5)); }
#hudParty { position: absolute; left: calc(var(--u) * 6); top: calc(var(--u) * 6); display: flex; gap: calc(var(--u) * 3); align-items: flex-start; }
.hcard { width: calc(var(--u) * 62); background: rgba(8, 26, 31, .82); border: 1px solid rgba(233, 196, 106, .4); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 2.5); display: grid; grid-template-columns: calc(var(--u) * 16) 1fr; gap: calc(var(--u) * 2); align-items: center; transition: transform .2s, border-color .2s; opacity: .82; }
.hcard.active { border-color: var(--gold); opacity: 1; transform: translateY(calc(var(--u) * 1)); box-shadow: 0 0 calc(var(--u) * 6) rgba(233, 196, 106, .35); }
.hcard canvas { position: static !important; width: calc(var(--u) * 16) !important; height: calc(var(--u) * 16) !important; image-rendering: pixelated; background: #173e42; border-radius: calc(var(--u) * 1.5); }
.hcard b { display: block; font-size: .92em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: calc(var(--u) * 2.4); background: #2a1a24; border-radius: 2px; overflow: hidden; margin-top: calc(var(--u) * 1.2); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4); }
.bar i { display: block; height: 100%; background: linear-gradient(#7ff0a8, #36b36a); transition: width .3s; }
.bar.mp i { background: linear-gradient(#b4d8ff, #5a8ae0); }
.bar.low i { background: linear-gradient(#ff9a8a, #e5484d); }
.kanasBar { position: absolute; left: calc(var(--u) * 6); top: calc(var(--u) * 33); width: calc(var(--u) * 192); display: flex; gap: calc(var(--u) * 4); align-items: center; font-size: .8em; color: var(--muted); }
.kanasBar .bar { flex: 1; margin: 0; }
.combo { color: var(--gold2); text-shadow: 0 0 6px rgba(233, 196, 106, .6); white-space: nowrap; }
#hudRight { position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 6); display: flex; gap: calc(var(--u) * 3); }
#hudRight > div { background: rgba(8, 26, 31, .82); border: 1px solid rgba(233, 196, 106, .4); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 2) calc(var(--u) * 4); display: flex; align-items: center; gap: calc(var(--u) * 2); }
#hudRight small { color: var(--muted); font-size: .72em; }
.sema i { width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 50%; background: #8a9a9a; box-shadow: 0 0 calc(var(--u) * 4) currentColor; }
#hudPlace { position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 24); text-align: right; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, .6); }
#hudPlace small { display: block; color: var(--gold2); font-size: .75em; letter-spacing: .08em; text-transform: uppercase; }
#hudPlace b { font-size: 1.05em; }
#hudObjective { position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 44); max-width: calc(var(--u) * 150); background: rgba(8, 26, 31, .78); border-left: calc(var(--u) * 1.5) solid var(--gold); padding: calc(var(--u) * 2.5) calc(var(--u) * 4); border-radius: 0 calc(var(--u) * 2) calc(var(--u) * 2) 0; font-size: .9em; line-height: 1.3; }
#hudObjective small { display: block; color: var(--gold2); font-size: .72em; letter-spacing: .1em; text-transform: uppercase; }
#hudPrompt { position: absolute; left: 50%; bottom: calc(var(--u) * 14); transform: translateX(-50%); background: rgba(8, 26, 31, .92); border: 1px solid var(--gold); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 2.5) calc(var(--u) * 5); display: flex; gap: calc(var(--u) * 3); align-items: center; white-space: nowrap; animation: pop .2s ease-out; }
#hudKeys { position: absolute; left: calc(var(--u) * 6); bottom: calc(var(--u) * 5); display: flex; gap: calc(var(--u) * 5); font-size: .75em; color: rgba(244, 236, 216, .75); text-shadow: 0 1px 0 #000; }
#hudKeys kbd { font-size: .9em; }
body.touch #hudKeys { display: none; }
@keyframes pop { from { transform: translateX(-50%) scale(.9); opacity: 0; } }

/* ── Capa de interfaz modal ── */
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; background: rgba(4, 10, 14, .55); backdrop-filter: blur(2px); animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.modal > .pnl { max-height: 94vh; overflow: auto; font-size: var(--fs); }

/* Diálogo */
.dlg { position: absolute; left: 50%; bottom: calc(var(--u) * 8); transform: translateX(-50%); width: min(96%, calc(var(--u) * 560)); min-height: calc(var(--u) * 74); display: grid; grid-template-columns: calc(var(--u) * 64) 1fr; gap: calc(var(--u) * 6); padding: calc(var(--u) * 6) calc(var(--u) * 8); z-index: 20; font-size: max(13px, calc(var(--u) * 6.8)); animation: rise .25s ease-out; }
@keyframes rise { from { transform: translate(-50%, calc(var(--u) * 10)); opacity: 0; } }
.dlg .pt { width: calc(var(--u) * 64); height: calc(var(--u) * 64); background: radial-gradient(circle at 50% 35%, #24545a, #0f2a30); border: 1px solid rgba(233, 196, 106, .5); border-radius: calc(var(--u) * 2); overflow: hidden; }
.dlg .pt canvas { position: static !important; width: 100% !important; height: 100% !important; image-rendering: pixelated; }
.dlg .who { font-family: var(--fpx); font-weight: 700; color: var(--gold2); font-size: 1.05em; margin-bottom: calc(var(--u) * 2); display: flex; gap: .6em; align-items: baseline; }
.dlg .who small { font-weight: 400; color: var(--muted); font-size: .75em; }
.dlg .txt { font-family: var(--fpx); line-height: 1.42; min-height: 3em; white-space: pre-line; }
.dlg .txt em { color: var(--aqua); font-style: normal; }
.dlg .txt strong { color: var(--gold2); }
.dlg .next { position: absolute; right: calc(var(--u) * 6); bottom: calc(var(--u) * 4); color: var(--gold); animation: bob .8s infinite; font-family: var(--fpx); }
@keyframes bob { 50% { transform: translateY(calc(var(--u) * 1.5)); } }
.dlg.noPt { grid-template-columns: 1fr; }
.dlg .choices { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 4); }
.radio .txt { color: #cfe8ff; }
.radio .pt { background: repeating-linear-gradient(0deg, #0f2a30 0 2px, #143840 2px 4px); }

/* Pregunta (Juicio de Saberes) */
.qpanel { width: min(97vw, calc(var(--u) * 624)); height: min(94vh, calc(var(--u) * 340)); display: grid; grid-template-rows: auto 1fr; padding: 0; overflow: hidden !important; }
.qhead { display: flex; align-items: center; gap: .6em; padding: .7em 1em; border-bottom: 1px solid rgba(233, 196, 106, .25); background: linear-gradient(90deg, rgba(233, 196, 106, .12), transparent 60%); flex-wrap: wrap; }
.qhead h2 { font-family: var(--fpx); font-size: 1.1em; margin: 0 .4em 0 0; color: var(--gold2); }
.qhead .thermo { margin-left: auto; display: flex; align-items: center; gap: .5em; font-family: var(--fpx); font-size: .8em; color: var(--muted); }
.thermo .bar { width: calc(var(--u) * 60); margin: 0; height: calc(var(--u) * 3); }
.thermo .bar i { background: linear-gradient(90deg, #ff8a5a, #ffd25a); }
.qbody { display: grid; grid-template-columns: minmax(0, 43%) minmax(0, 57%); min-height: 0; }
.qbody.full { grid-template-columns: 1fr; }
.codexPane { border-right: 1px solid rgba(233, 196, 106, .2); overflow: auto; padding: .8em 1em 1em; background: linear-gradient(180deg, rgba(251, 243, 226, .04), transparent); font-size: .92em; }
.codexPane h3 { font-family: var(--fpx); color: var(--gold2); font-size: 1em; margin: .2em 0 .5em; }
.codexPane h4 { font-family: var(--fpx); color: var(--aqua); margin: 1em 0 .3em; font-size: .95em; }
.codexPane p, .codexPane li { line-height: 1.55; color: #e9e2d0; }
.codexPane blockquote { margin: .5em 0; padding: .5em .8em; border-left: 3px solid var(--coral); background: rgba(255, 122, 133, .08); font-style: italic; color: #ffe6e0; line-height: 1.5; }
.codexPane .formula { font-family: var(--fpx); font-size: 1.2em; text-align: center; padding: .4em; background: rgba(127, 224, 196, .08); border: 1px dashed rgba(127, 224, 196, .4); border-radius: 6px; color: var(--aqua); }
.codexPane .note { font-size: .88em; color: var(--muted); border: 1px dashed rgba(255, 255, 255, .2); padding: .4em .6em; border-radius: 6px; }
.codexPane table { width: 100%; border-collapse: collapse; font-size: .86em; margin: .4em 0; }
.codexPane th { text-align: left; background: rgba(233, 196, 106, .16); color: var(--gold2); font-family: var(--fpx); font-weight: 600; padding: .35em .45em; }
.codexPane td { border-top: 1px solid rgba(255, 255, 255, .1); padding: .35em .45em; vertical-align: top; line-height: 1.4; }
.codexPane .locked { opacity: .55; font-style: italic; }
.qmain { overflow: auto; padding: .9em 1.1em 1em; display: flex; flex-direction: column; gap: .6em; }
.qstem p { margin: 0 0 .55em; line-height: 1.55; font-size: 1.02em; }
.qstem mark { background: rgba(233, 196, 106, .28); color: var(--gold2); padding: 0 .15em; border-radius: 3px; box-shadow: 0 0 0 1px rgba(233, 196, 106, .4); }
.opts { display: grid; gap: .5em; }
.opt { text-align: left; display: grid; grid-template-columns: 2em 1fr; gap: .7em; align-items: start; padding: .6em .75em; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px; line-height: 1.45; transition: background .12s, border-color .12s, transform .12s; }
.opt b { font-family: var(--fpx); display: grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; border: 1px solid rgba(233, 196, 106, .6); color: var(--gold2); }
.opt:hover, .opt.sel { background: rgba(127, 224, 196, .1); border-color: var(--aqua); }
.opt.sel b { background: var(--aqua); color: #0b1d22; border-color: var(--aqua); }
.opt.struck { opacity: .35; text-decoration: line-through; pointer-events: none; }
.opt.right { border-color: var(--green); background: rgba(70, 195, 123, .16); }
.opt.right b { background: var(--green); color: #06210f; border-color: var(--green); }
.opt.wrong { border-color: var(--red); background: rgba(229, 72, 77, .14); }
.opt.wrong b { background: var(--red); color: #fff; border-color: var(--red); }
.qfoot { display: flex; gap: .6em; justify-content: flex-end; align-items: center; margin-top: auto; padding-top: .4em; flex-wrap: wrap; }
.qfoot .hint { margin-right: auto; font-size: .82em; color: var(--muted); font-family: var(--fpx); }
.fb { border-radius: 8px; padding: .75em .9em; line-height: 1.55; animation: fade .3s; }
.fb.ok { background: rgba(70, 195, 123, .13); border: 1px solid rgba(70, 195, 123, .6); }
.fb.no { background: rgba(240, 140, 58, .12); border: 1px solid rgba(240, 140, 58, .6); }
.fb h4 { margin: 0 0 .3em; font-family: var(--fpx); font-size: 1.05em; }
.fb.ok h4 { color: #8ff0b4; } .fb.no h4 { color: #ffc38a; }
.fb p { margin: .3em 0; }
.fb .reward { font-family: var(--fpx); color: var(--gold2); }
.tabs { display: flex; gap: .3em; flex-wrap: wrap; margin-bottom: .4em; }
.tabs button { font-family: var(--fpx); font-size: .82em; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .15); border-radius: 99px; padding: .2em .7em; color: var(--muted); }
.tabs button.on { background: rgba(233, 196, 106, .2); color: var(--gold2); border-color: var(--gold); }
.soloLadder { display: flex; gap: 3px; }
.soloLadder i { width: calc(var(--u) * 6); height: calc(var(--u) * 3); background: rgba(255, 255, 255, .15); border-radius: 2px; }
.soloLadder i.on { background: var(--gold); box-shadow: 0 0 6px rgba(233, 196, 106, .6); }

/* Panel genérico (códice, menú, tienda, tablero…) */
.wide { width: min(96vw, calc(var(--u) * 560)); padding: 1em 1.2em 1.1em; }
.wide h2 { font-family: var(--fpx); color: var(--gold2); margin: .1em 0 .6em; font-size: 1.35em; }
.wide h3 { font-family: var(--fpx); color: var(--aqua); margin: 1em 0 .4em; font-size: 1.05em; }
.closeX { position: absolute; right: .6em; top: .5em; width: 2em; height: 2em; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .06); font-family: var(--fpx); }
.menuList { display: grid; gap: .45em; }
.menuList .btn { text-align: left; display: flex; justify-content: space-between; align-items: center; }
.menuList .btn.shopItem { display: grid; }
.menuList.cols2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 22em), 1fr)); }
.menuList .btn small { color: var(--muted); font-family: var(--ftx); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6em; }
.shopItem { display: grid; grid-template-columns: 2.4em 1fr auto; gap: .7em; align-items: center; padding: .55em .7em; border: 1px solid rgba(255, 255, 255, .14); border-radius: 8px; background: rgba(255, 255, 255, .03); }
.shopItem .em { font-size: 1.6em; text-align: center; }
.shopItem b { font-family: var(--fpx); color: var(--gold2); }
.shopItem p { margin: .15em 0 0; font-size: .85em; color: var(--muted); line-height: 1.4; }
.price { font-family: var(--fpx); white-space: nowrap; }
.dash table { width: 100%; border-collapse: collapse; font-size: .92em; }
.dash th, .dash td { padding: .4em .45em; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.dash th { font-family: var(--fpx); color: var(--gold2); font-weight: 600; font-size: .85em; }
.dash td:first-child, .dash th:first-child { text-align: left; }
.dot { display: inline-block; width: .9em; height: .9em; border-radius: 50%; vertical-align: -.1em; box-shadow: 0 0 6px currentColor; }
.attr { display: grid; grid-template-columns: 12em 1fr 5em 5.5em; gap: .6em; align-items: center; margin: .35em 0; font-size: .95em; }
.attr .bar { margin: 0; height: .7em; }
.attr .bar i { background: linear-gradient(90deg, var(--c, #7fe0c4), #fff7); }
.note { color: var(--muted); font-size: .85em; line-height: 1.5; }
label.field { display: grid; gap: .3em; font-family: var(--fpx); font-size: .9em; color: var(--gold2); }
input.inp, select.inp { font: inherit; font-family: var(--ftx); background: #0b2328; color: var(--text); border: 1px solid rgba(127, 184, 168, .6); border-radius: 6px; padding: .55em .7em; }
.range { display: grid; grid-template-columns: 10em 1fr 3em; gap: .6em; align-items: center; margin: .4em 0; }
.range input { width: 100%; accent-color: var(--gold); }

/* Combate */
.bmenu { position: absolute; left: 50%; bottom: calc(var(--u) * 6); transform: translateX(-50%); display: flex; gap: calc(var(--u) * 3); padding: calc(var(--u) * 4) calc(var(--u) * 5); font-family: var(--fpx); font-size: max(12px, calc(var(--u) * 6)); z-index: 15; animation: rise .2s ease-out; }
.bmenu .btn { padding: .45em .8em; display: flex; flex-direction: column; align-items: center; gap: .1em; min-width: 5.6em; }
.bmenu .btn small { font-family: var(--ftx); font-weight: 400; font-size: .68em; color: var(--muted); }
.bmenu .btn.ult { background: linear-gradient(#c2457a, #7a2f55); border-color: #ffd0e4; animation: glow 1s infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 calc(var(--u) * 10) #ff7ab8; } }
.bwho { position: absolute; left: 50%; bottom: calc(var(--u) * 40); transform: translateX(-50%); font-family: var(--fpx); color: var(--gold2); text-shadow: 0 1px 0 #000; font-size: max(12px, calc(var(--u) * 6)); }
.bsub { position: absolute; left: calc(var(--u) * 4); right: calc(var(--u) * 4); bottom: calc(var(--u) * 40); display: flex; justify-content: center; gap: .5em; flex-wrap: wrap; font-size: max(12px, calc(var(--u) * 5.6)); }
.bannerBig { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: var(--fpx); font-weight: 700; font-size: calc(var(--u) * 22); color: #fff; text-shadow: 0 0 calc(var(--u) * 6) var(--c, #ff7ab8), 0 calc(var(--u) * 1.5) 0 #2a0f22; letter-spacing: .04em; pointer-events: none; animation: slam .9s ease-out forwards; z-index: 25; }
.bannerBig small { display: block; font-size: .35em; color: var(--gold2); letter-spacing: .2em; }
@keyframes slam { 0% { transform: scale(2.2); opacity: 0; } 18% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }

/* Simuladores */
.sim { width: min(97vw, calc(var(--u) * 620)); max-height: 94vh; padding: .9em 1.1em 1em; }
.simTop { display: flex; justify-content: space-between; align-items: center; gap: 1em; flex-wrap: wrap; }
.simTop h2 { margin: 0; }
.temp { display: flex; align-items: center; gap: .5em; font-family: var(--fpx); color: #ffb08a; }
.temp .bar { width: calc(var(--u) * 80); margin: 0; height: calc(var(--u) * 3.5); }
.temp .bar i { background: linear-gradient(90deg, #ffd25a, #ff5a3a); }
.simInstr { margin: .5em 0 .7em; line-height: 1.5; color: #e9e2d0; }
.bins { display: grid; gap: .6em; }
.bin { border: 1px dashed rgba(233, 196, 106, .5); border-radius: 10px; padding: .5em; min-height: 5.5em; background: rgba(255, 255, 255, .03); transition: background .15s; }
.bin.hot { background: rgba(127, 224, 196, .12); border-style: solid; }
.bin h4 { margin: 0 0 .35em; font-family: var(--fpx); color: var(--gold2); font-size: .9em; display: flex; gap: .4em; align-items: center; }
.bin h4 kbd { font-size: .8em; }
.cards { display: flex; flex-wrap: wrap; gap: .45em; margin: .4em 0; min-height: 2.5em; }
.card { background: #f6ecd6; color: #2a1e14; border-radius: 6px; padding: .45em .6em; font-size: .92em; line-height: 1.35; box-shadow: 0 2px 0 #b9a27a; cursor: grab; max-width: 100%; border: 2px solid transparent; touch-action: none; }
.card.sel { border-color: #2fb3a8; box-shadow: 0 0 0 2px #2fb3a8, 0 2px 0 #b9a27a; }
.card.ok { background: #d6f5e0; box-shadow: 0 2px 0 #6ab07a; cursor: default; }
.card.bad { animation: shake .35s; background: #ffd6cc; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.sliders { display: grid; gap: .5em; }
.sl { display: grid; grid-template-columns: minmax(8em, 15em) 1fr 7em; gap: .7em; align-items: center; }
.sl input[type=range] { width: 100%; accent-color: var(--gold); }
.sl output { font-family: var(--fpx); color: var(--gold2); text-align: right; }
.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10em, 1fr)); gap: .5em; margin: .7em 0; }
.ro { background: rgba(0, 0, 0, .25); border: 1px solid rgba(127, 224, 196, .3); border-radius: 8px; padding: .45em .6em; }
.ro small { display: block; color: var(--muted); font-size: .78em; }
.ro b { font-family: var(--fpx); font-size: 1.2em; }
.ro.good b { color: #8ff0b4; } .ro.bad b { color: #ff9a8a; }
.simViz { width: min(100%, calc(var(--u) * 300)); height: auto; aspect-ratio: 10 / 3; margin-inline: auto !important; image-rendering: pixelated; border-radius: 8px; background: #0b2328; display: block; margin: .3em 0; }
.toggle { display: flex; gap: .4em; }

/* Resultados y títulos */
.results { width: min(96vw, calc(var(--u) * 460)); padding: 1.2em 1.4em; text-align: center; }
.results .stars { font-size: 2em; letter-spacing: .2em; color: var(--gold); text-shadow: 0 0 10px rgba(233, 196, 106, .6); }
.statGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5em; margin: .8em 0; }
.statGrid div { background: rgba(255, 255, 255, .05); border-radius: 8px; padding: .5em; }
.statGrid b { display: block; font-family: var(--fpx); font-size: 1.3em; color: var(--gold2); }
.statGrid small { color: var(--muted); }

.title { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; pointer-events: none; z-index: 10; }
.titleLogo { align-self: start; justify-self: center; text-align: center; margin-top: calc(var(--u) * 34); }
.titleLogo .t1 { font-family: var(--fpx); font-size: calc(var(--u) * 9); color: var(--gold2); letter-spacing: .4em; text-shadow: 0 0 calc(var(--u) * 6) #ff9ec7; }
.titleLogo .t2 { font-family: var(--fpx); font-weight: 700; font-size: calc(var(--u) * 34); line-height: .95; color: #fff8e6; text-shadow: 0 calc(var(--u) * 1.5) 0 #7a2f55, 0 calc(var(--u) * 3) 0 #2a0f22, 0 0 calc(var(--u) * 16) rgba(255, 158, 199, .7); }
.titleLogo .t3 { font-family: var(--fpx); font-size: calc(var(--u) * 9); color: #cfe8ff; margin-top: calc(var(--u) * 4); text-shadow: 0 1px 0 #000; }
.titleMenu { justify-self: center; margin-bottom: calc(var(--u) * 12); display: grid; gap: calc(var(--u) * 3); width: calc(var(--u) * 150); pointer-events: auto; font-size: max(13px, calc(var(--u) * 6.4)); }
.titleMenu .btn { padding: .55em 1em; }
.press { justify-self: center; margin-bottom: calc(var(--u) * 40); font-family: var(--fpx); font-size: max(14px, calc(var(--u) * 8)); color: #fff8e6; text-shadow: 0 0 8px #ff9ec7; animation: blink 1.2s infinite; pointer-events: auto; cursor: pointer; }
@keyframes blink { 50% { opacity: .35; } }
.credits { position: absolute; bottom: calc(var(--u) * 4); left: 0; right: 0; text-align: center; font-size: max(9px, calc(var(--u) * 4.2)); color: rgba(244, 236, 216, .6); font-family: var(--fpx); pointer-events: none; }

/* Mapa de La Guajira */
.mapInfo { position: absolute; right: calc(var(--u) * 8); bottom: calc(var(--u) * 10); width: calc(var(--u) * 168); padding: calc(var(--u) * 6); font-size: max(12px, calc(var(--u) * 5.8)); z-index: 12; }
.mapInfo h3 { margin: 0 0 .2em; font-family: var(--fpx); color: var(--gold2); font-size: 1.25em; }
.mapInfo .sub { color: var(--aqua); font-family: var(--fpx); margin-bottom: .5em; }
.mapInfo p { margin: .3em 0; line-height: 1.45; color: #e9e2d0; }
.mapInfo .row { display: flex; gap: .4em; flex-wrap: wrap; margin: .5em 0; }
.mapBar { position: absolute; left: calc(var(--u) * 8); bottom: calc(var(--u) * 8); display: flex; gap: calc(var(--u) * 3); z-index: 12; font-size: max(12px, calc(var(--u) * 5.6)); }

/* Toasts */
#toasts { position: absolute; left: 50%; top: calc(var(--u) * 52); transform: translateX(-50%); display: grid; gap: calc(var(--u) * 3); z-index: 40; pointer-events: none; justify-items: center; }
.toast { background: rgba(8, 26, 31, .95); border: 1px solid var(--gold); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 2.5) calc(var(--u) * 6); font-family: var(--fpx); font-size: max(12px, calc(var(--u) * 5.8)); box-shadow: 0 4px 18px rgba(0, 0, 0, .4); animation: toastIn .3s ease-out, toastOut .4s ease-in forwards; animation-delay: 0s, var(--d, 2.6s); white-space: nowrap; }
.toast.gold { border-color: #fff1c0; background: linear-gradient(90deg, rgba(122, 84, 24, .95), rgba(8, 26, 31, .95)); }
@keyframes toastIn { from { transform: translateY(calc(var(--u) * -6)); opacity: 0; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(calc(var(--u) * -4)); } }

/* Táctil */
#touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 9; }
body.touch #touch { display: block; }
body[data-scene=title] #touch, body[data-scene=map] #touch, body:has(#ui .modal) #touch { display: none; }
body:has(#ui .dlg) #joy, body:has(#ui .dlg) .tbtns button:not(.tA), body:has(#ui .bmenu) #joy, body:has(#ui .bmenu) .tbtns button:not(.tA) { visibility: hidden; }
#joy { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: clamp(96px, 15vmin + 40px, 150px); aspect-ratio: 1; border-radius: 50%; background: rgba(8, 26, 31, .35); border: 2px solid rgba(255, 255, 255, .35); touch-action: none; pointer-events: auto; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%; background: rgba(246, 221, 154, .8); border: 2px solid #fff; pointer-events: none; }
.tbtns { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, auto); gap: 8px; align-items: center; justify-items: center; }
.tbtns button { width: clamp(44px, 6vmin + 22px, 60px); height: clamp(44px, 6vmin + 22px, 60px); border-radius: 50%; background: rgba(8, 26, 31, .7); border: 2px solid rgba(233, 196, 106, .8); color: var(--gold2); font-family: var(--fpx); font-size: 18px; touch-action: none; pointer-events: auto; }
.tbtns .tA { grid-column: 3; grid-row: 2; width: clamp(56px, 8vmin + 28px, 76px); height: clamp(56px, 8vmin + 28px, 76px); background: rgba(194, 69, 122, .75); color: #fff; }

/* Arranque */
#boot { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; background: radial-gradient(circle at 50% 40%, #173e42, #05090b); z-index: 50; text-align: center; transition: opacity .6s; }
#boot.hide { opacity: 0; pointer-events: none; }
.bootLogo { font-family: var(--fpx); font-size: max(22px, calc(var(--u) * 18)); color: var(--gold2); text-shadow: 0 0 14px rgba(255, 158, 199, .5); }
.bootBar { width: min(60vw, 320px); height: 8px; background: #1a2a2e; border-radius: 4px; overflow: hidden; justify-self: center; }
.bootBar i { display: block; height: 100%; width: 0; background: var(--kanas); background-size: 30px 100%; transition: width .2s; }
#boot small { color: var(--muted); font-family: var(--fpx); }
#rotate { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  #rotate { display: grid; place-items: center; position: fixed; left: 0; right: 0; top: 0; padding: 10px; font-family: var(--fpx); background: rgba(194, 69, 122, .9); color: #fff; z-index: 60; font-size: 14px; }
}

/* Certificado imprimible */
.cert { width: min(96vw, 900px); background: #fbf3e2; color: #2a1e14; padding: 2.2em 2.6em; border: 10px solid transparent; border-image: var(--kanas) 10; font-family: var(--ftx); }
.cert h1 { font-family: var(--fpx); text-align: center; font-size: 2.1em; margin: .2em 0; color: #7a2f55; }
.cert .sub { text-align: center; letter-spacing: .25em; font-family: var(--fpx); color: #2a7f9e; }
.cert table { width: 100%; border-collapse: collapse; margin-top: 1em; }
.cert td, .cert th { border-bottom: 1px solid #d9c8a0; padding: .45em; text-align: left; }
@media print {
  body * { visibility: hidden; }
  .cert, .cert * { visibility: visible; }
  .cert { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
  .modal { position: static; background: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition: none !important; } }

<script>
/* ── js/core/util.js ── */
/* Utilidades compartidas: matemáticas, azar con semilla, color y texto. */
window.W = window.W || {};

(function () {
  'use strict';

  const U = {};

  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.inv = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
  U.smooth = t => t * t * (3 - 2 * t);
  U.easeOut = t => 1 - Math.pow(1 - t, 3);
  U.easeIn = t => t * t * t;
  U.easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  U.easeBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  U.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  U.approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  U.sign = v => (v > 0 ? 1 : v < 0 ? -1 : 0);

  // Azar determinista (mulberry32) para que el arte procedural sea estable.
  U.rng = function (seed) {
    let a = seed >>> 0;
    const f = function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
    f.pick = arr => arr[Math.floor(f() * arr.length)];
    f.range = (lo, hi) => lo + f() * (hi - lo);
    return f;
  };

  U.hash = function (x, y, seed) {
    let h = (x * 374761393 + y * 668265263 + (seed || 0) * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };

  // Ruido de valor suave en 2D.
  U.noise = function (x, y, seed) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = U.hash(xi, yi, seed), b = U.hash(xi + 1, yi, seed);
    const c = U.hash(xi, yi + 1, seed), d = U.hash(xi + 1, yi + 1, seed);
    const u = U.smooth(xf), v = U.smooth(yf);
    return U.lerp(U.lerp(a, b, u), U.lerp(c, d, u), v);
  };
  U.fbm = function (x, y, seed, oct) {
    let s = 0, amp = 0.5, f = 1;
    for (let i = 0; i < (oct || 3); i++) { s += amp * U.noise(x * f, y * f, seed + i * 17); f *= 2; amp *= 0.5; }
    return s / (1 - Math.pow(0.5, oct || 3));
  };

  U.shuffle = function (arr, rnd) {
    const r = rnd || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  // ── Color ──
  U.hex = function (h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  U.toHex = function (r, g, b) {
    const c = v => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  };
  U.mix = function (a, b, t) {
    const A = U.hex(a), B = U.hex(b);
    return U.toHex(U.lerp(A[0], B[0], t), U.lerp(A[1], B[1], t), U.lerp(A[2], B[2], t));
  };
  // amt > 0 aclara, amt < 0 oscurece, con leve giro de tono para sombras frías y luces cálidas.
  U.shade = function (c, amt) {
    if (amt >= 0) return U.mix(c, '#fff4d6', amt);
    return U.mix(c, '#1c1030', -amt);
  };
  U.rgba = function (c, a) {
    const A = U.hex(c);
    return 'rgba(' + A[0] + ',' + A[1] + ',' + A[2] + ',' + a + ')';
  };

  // ── Texto ──
  U.esc = function (s) {
    return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  };
  U.num = n => Math.round(n).toLocaleString('es-CO');
  U.pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);

  U.makeCanvas = function (w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    c.ctx = ctx;
    return c;
  };

  U.now = () => performance.now() / 1000;

  W.U = U;
}());

/* ── js/core/render.js ── */
/* Tubería de render HD-2D:
   1. El mundo se pinta en un lienzo de 640×360 píxeles (arte pixel nítido).
   2. Sobre ese lienzo se aplican la Cera Gris (desaturación con halo de color) y la luz ambiental.
   3. Se escala a la pantalla completa con el método «sharp bilinear» (entero + suavizado).
   4. Capas HD encima: profundidad de campo (tilt-shift), resplandores aditivos y partículas suaves. */
window.W = window.W || {};

(function () {
  'use strict';
  const U = W.U;

  const R = {
    VW: 640, VH: 360,
    s: 1, cssScale: 1,
    cam: { x: 0, y: 0, shake: 0, sx: 0, sy: 0 },
    lights: [],
    ambient: '#ffffff',
    wax: { amount: 0, holes: [], tint: '#f3ead8' },
    flash: { a: 0, color: '#ffffff' },
    hd: true,
    dofOn: true
  };

  R.init = function (root) {
    R.root = root;
    R.low = U.makeCanvas(R.VW, R.VH); R.lctx = R.low.ctx;
    R.lightC = U.makeCanvas(R.VW, R.VH);
    R.waxC = U.makeCanvas(R.VW, R.VH);
    R.tintC = U.makeCanvas(R.VW, R.VH);
    R.up = U.makeCanvas(R.VW, R.VH);

    R.screen = root.querySelector('#screen'); R.sctx = R.screen.getContext('2d');
    R.dof = root.querySelector('#dof'); R.dctx = R.dof.getContext('2d');
    R.dof.width = R.VW; R.dof.height = R.VH;
    R.fxc = root.querySelector('#fx'); R.fctx = R.fxc.getContext('2d');
    R.over = root.querySelector('#over'); R.octx = R.over.getContext('2d');
    window.addEventListener('resize', R.resize);
    document.addEventListener('fullscreenchange', () => setTimeout(R.resize, 50));
    R.resize();
  };

  R.resize = function () {
    const box = R.root;
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = Math.round(vw * 9 / 16);
    if (h > vh) { h = vh; w = Math.round(vh * 16 / 9); }
    box.style.width = w + 'px';
    box.style.height = h + 'px';
    box.style.left = Math.round((vw - w) / 2) + 'px';
    box.style.top = Math.round((vh - h) / 2) + 'px';
    document.documentElement.style.setProperty('--u', (h / R.VH) + 'px');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    [R.screen, R.fxc, R.over].forEach(c => { c.width = pw; c.height = ph; });
    R.s = pw / R.VW;
    R.cssScale = w / R.VW;
    const k = Math.max(1, Math.ceil(R.s - 0.001));
    if (R.up.width !== R.VW * k) { R.up.width = R.VW * k; R.up.height = R.VH * k; }
    R.k = k;
    R.sctx.imageSmoothingEnabled = true;
    R.sctx.imageSmoothingQuality = 'high';
  };

  // ── Resplandores (sprites radiales cacheados) ──
  const glowCache = {};
  R.glow = function (color, soft) {
    const key = color + (soft ? 's' : '');
    if (glowCache[key]) return glowCache[key];
    const c = U.makeCanvas(128, 128), g = c.ctx;
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    const A = U.hex(color);
    const col = a => 'rgba(' + A[0] + ',' + A[1] + ',' + A[2] + ',' + a + ')';
    if (soft) {
      gr.addColorStop(0, col(0.55)); gr.addColorStop(0.5, col(0.18)); gr.addColorStop(1, col(0));
    } else {
      gr.addColorStop(0, col(1)); gr.addColorStop(0.25, col(0.75)); gr.addColorStop(0.6, col(0.22)); gr.addColorStop(1, col(0));
    }
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    glowCache[key] = c;
    return c;
  };

  R.beginFrame = function () {
    R.posted = false;
    R.lights.length = 0;
    R.wax.holes.length = 0;
    const c = R.cam;
    if (c.shake > 0) {
      c.sx = Math.round((Math.random() * 2 - 1) * c.shake);
      c.sy = Math.round((Math.random() * 2 - 1) * c.shake);
      c.shake = Math.max(0, c.shake - 0.6);
    } else { c.sx = 0; c.sy = 0; }
    R.lctx.setTransform(1, 0, 0, 1, 0, 0);
    R.lctx.globalAlpha = 1;
    R.lctx.globalCompositeOperation = 'source-over';
    R.fctx.setTransform(1, 0, 0, 1, 0, 0);
    R.fctx.clearRect(0, 0, R.fxc.width, R.fxc.height);
    R.fctx.setTransform(R.s, 0, 0, R.s, 0, 0);
    R.octx.setTransform(1, 0, 0, 1, 0, 0);
    R.octx.clearRect(0, 0, R.over.width, R.over.height);
    R.octx.setTransform(R.s, 0, 0, R.s, 0, 0);
  };

  // Luz en coordenadas de pantalla baja (640×360).
  R.light = function (x, y, r, color, a, bloom) {
    R.lights.push({ x, y, r, color, a: a == null ? 1 : a, bloom: bloom == null ? 0.6 : bloom });
  };
  R.waxHole = function (x, y, r) { R.wax.holes.push({ x, y, r }); };

  function applyWax() {
    const wx = R.wax;
    if (wx.amount <= 0.001) return;
    const m = R.waxC.ctx;
    m.globalCompositeOperation = 'source-over';
    m.clearRect(0, 0, R.VW, R.VH);
    m.fillStyle = '#808080';
    m.fillRect(0, 0, R.VW, R.VH);
    m.globalCompositeOperation = 'destination-out';
    for (const h of wx.holes) {
      const g = m.createRadialGradient(h.x, h.y, h.r * 0.55, h.x, h.y, h.r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      m.fillStyle = g;
      m.fillRect(h.x - h.r, h.y - h.r, h.r * 2, h.r * 2);
    }
    m.globalCompositeOperation = 'source-over';
    const t = R.tintC.ctx;
    t.globalCompositeOperation = 'source-over';
    t.clearRect(0, 0, R.VW, R.VH);
    t.drawImage(R.waxC, 0, 0);
    t.globalCompositeOperation = 'source-in';
    t.fillStyle = wx.tint;
    t.fillRect(0, 0, R.VW, R.VH);
    t.globalCompositeOperation = 'source-over';

    const l = R.lctx;
    l.save();
    l.globalAlpha = U.clamp(wx.amount, 0, 1) * 0.86;
    l.globalCompositeOperation = 'saturation';
    l.drawImage(R.waxC, 0, 0);
    l.globalAlpha = U.clamp(wx.amount, 0, 1) * 0.16;
    l.globalCompositeOperation = 'screen';
    l.drawImage(R.tintC, 0, 0);
    l.globalAlpha = U.clamp(wx.amount, 0, 1) * 0.2;
    l.globalCompositeOperation = 'soft-light';
    l.drawImage(R.tintC, 0, 0);
    l.restore();
  }

  function applyLight() {
    if (R.ambient.toLowerCase() === '#ffffff' && !R.lights.length) return;
    const g = R.lightC.ctx;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = R.ambient;
    g.fillRect(0, 0, R.VW, R.VH);
    g.globalCompositeOperation = 'lighter';
    for (const L of R.lights) {
      g.globalAlpha = U.clamp(L.a, 0, 1);
      g.drawImage(R.glow(L.color), L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    const l = R.lctx;
    l.save();
    l.globalCompositeOperation = 'multiply';
    l.drawImage(R.lightC, 0, 0);
    l.restore();
  }

  function bloom() {
    if (!R.hd) return;
    const f = R.fctx;
    f.save();
    f.globalCompositeOperation = 'lighter';
    for (const L of R.lights) {
      if (L.bloom <= 0) continue;
      const r = L.r * 0.55;
      f.globalAlpha = U.clamp(L.a * L.bloom * 0.38, 0, 1);
      f.drawImage(R.glow(L.color, true), L.x - r, L.y - r, r * 2, r * 2);
    }
    f.restore();
  }

  // Aplica cera y luz sobre el mundo pintado; debe llamarse antes de la interfaz pixelada.
  R.post = function () {
    if (R.posted) return;
    R.posted = true;
    applyWax();
    applyLight();
  };

  R.present = function () {
    const k = R.k;
    if (Math.abs(R.s - Math.round(R.s)) < 0.01) {
      R.sctx.imageSmoothingEnabled = false;
      R.sctx.drawImage(R.low, 0, 0, R.screen.width, R.screen.height);
    } else {
      const u = R.up.ctx;
      u.imageSmoothingEnabled = false;
      u.drawImage(R.low, 0, 0, R.VW * k, R.VH * k);
      R.sctx.imageSmoothingEnabled = true;
      R.sctx.imageSmoothingQuality = 'high';
      R.sctx.drawImage(R.up, 0, 0, R.screen.width, R.screen.height);
    }
    if (R.hd && R.dofOn) {
      R.dof.style.display = '';
      R.dctx.drawImage(R.low, 0, 0);
    } else {
      R.dof.style.display = 'none';
    }
    bloom();
    if (R.flash.a > 0.001) {
      R.octx.globalAlpha = R.flash.a;
      R.octx.fillStyle = R.flash.color;
      R.octx.fillRect(0, 0, R.VW, R.VH);
      R.octx.globalAlpha = 1;
      R.flash.a *= 0.86;
    }
  };

  R.doFlash = function (color, a) { R.flash.color = color || '#ffffff'; R.flash.a = a == null ? 0.8 : a; };
  R.shake = function (amt) { R.cam.shake = Math.max(R.cam.shake, amt); };

  // Utilidades de dibujo en el lienzo bajo.
  R.text = function (ctx, str, x, y, opts) {
    opts = opts || {};
    ctx.save();
    ctx.font = (opts.weight || '600') + ' ' + (opts.size || 8) + 'px "Pixelify Sans", monospace';
    ctx.textAlign = opts.align || 'left';
    ctx.textBaseline = opts.base || 'alphabetic';
    if (opts.shadow !== false) {
      ctx.fillStyle = opts.shadowColor || 'rgba(20,10,30,0.85)';
      ctx.fillText(str, Math.round(x) + 1, Math.round(y) + 1);
    }
    ctx.fillStyle = opts.color || '#fff6dc';
    ctx.fillText(str, Math.round(x), Math.round(y));
    ctx.restore();
  };

  W.R = R;
}());

/* ── js/core/input.js ── */
/* Entrada unificada: teclado, mando (Gamepad API), joystick táctil y clic/toque. */
window.W = window.W || {};

(function () {
  'use strict';

  const KEYMAP = {
    up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
    confirm: ['Enter', 'KeyE', 'Space', 'NumpadEnter'], cancel: ['Escape', 'Backspace'],
    action: ['Space', 'Enter', 'KeyE'], ability: ['KeyQ'], switch: ['Tab'], codex: ['KeyC'],
    menu: ['Escape', 'KeyM'], run: ['ShiftLeft', 'ShiftRight'], fullscreen: ['KeyF']
  };

  const I = {
    down: {}, pressed: {}, codes: new Set(), handlers: [],
    stick: { x: 0, y: 0 }, click: null, usingPad: false, touch: false, lastDevice: 'keyboard'
  };

  function actionsFor(code) {
    const out = [];
    for (const a in KEYMAP) if (KEYMAP[a].includes(code)) out.push(a);
    return out;
  }

  // Pila de manejadores de la interfaz: el de arriba recibe las teclas primero.
  I.push = function (fn) { I.handlers.push(fn); return fn; };
  I.pop = function (fn) { const i = I.handlers.lastIndexOf(fn); if (i >= 0) I.handlers.splice(i, 1); };
  I.emit = function (code, ev) {
    for (let i = I.handlers.length - 1; i >= 0; i--) {
      const r = I.handlers[i](code, ev);
      if (r !== false) return true;
    }
    return false;
  };

  function setAction(code, on) {
    for (const a of actionsFor(code)) {
      if (on && !I.down[a]) I.pressed[a] = true;
      I.down[a] = on;
    }
  }

  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
      if (e.code === 'Escape') e.target.blur();
      return;
    }
    I.lastDevice = 'keyboard';
    if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (I.handlers.length) {
      if (!e.repeat || ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        const used = I.emit(e.code, e);
        if (used && ['Enter', 'NumpadEnter', 'Space', 'Backspace'].includes(e.code)) e.preventDefault();
      } else if (['Enter', 'Space'].includes(e.code)) e.preventDefault();
      return;

/* ── js/art/terrain.js ── */
/* Terreno procedural: el suelo se calcula píxel a píxel con ruido continuo en coordenadas del mundo,
   así las texturas fluyen entre baldosas y los bordes naturales quedan orgánicos. Los acantilados
   se dibujan en perspectiva ¾ (cara frontal + superficie) y el agua tiene 4 cuadros animados. */
window.W = window.W || {};

(function () {
  'use strict';
  const U = W.U;
  const TS = 16;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.5);
  const NATURAL = { sand: 1, grass: 1, dirt: 1, desert: 1, salt: 1, scrub: 1, dune: 1, moss: 1, coal: 1, gravel: 1, coffee: 1, hedge: 1 };
  const FLOOR = { '.': 'g0', ',': 'g1', '-': 'path', ':': 'plaza', '_': 'path', 'f': 'g0' };

  const T = { TS };
  T.isWater = c => c === '~';
  T.isFloor = c => FLOOR[c] !== undefined;

  function rgbPal(arr) { return arr.map(c => U.hex(c)); }

  function pick3(pal, v) { return v < 0.36 ? pal[0] : v < 0.66 ? pal[1] : pal[2]; }

  // Devuelve el color [r,g,b] del estilo de suelo en el píxel (x, y) del mundo.
  function styleColor(def, x, y, seed, ctxInfo) {
    const pal = def._rgb || (def._rgb = rgbPal(def.c));
    const sp = def._sp || (def._sp = rgbPal(def.speck || def.c));
    const b = BAYER[(y & 3) * 4 + (x & 3)];
    const h = U.hash(x, y, seed);
    let n, v;
    switch (def.style) {
      case 'sand': {
        n = U.fbm(x / 38, y / 26, seed, 3);
        v = n + b * 0.14;
        const rip = Math.sin(x * 0.16 + y * 0.52 + n * 9);
        if (rip > 0.9 && n > 0.42) return pal[2];
        if (rip < -0.96 && n < 0.6) return pal[0];
        if (h < 0.004) return sp[Math.floor(U.hash(x, y, seed + 3) * sp.length)];
        return pick3(pal, v);
      }
      case 'dune': {
        n = U.fbm(x / 44, y / 30, seed, 3);
        const rip = Math.sin(x * 0.1 + y * 0.32 + n * 14);
        v = n * 0.6 + (rip * 0.5 + 0.5) * 0.4 + b * 0.12;
        if (rip > 0.86) return pal[2];
        return pick3(pal, v);
      }
      case 'grass': case 'hedge': {
        n = U.fbm(x / 22, y / 22, seed, 3);
        v = n + b * 0.16;
        if (def.style === 'hedge' && ((Math.floor(x / 12) % 2) === 0)) v += 0.12;
        if (U.hash(x, y, seed + 9) < 0.02) return pal[2];
        if (U.hash(x, y - 1, seed + 9) < 0.02) return pal[0];
        if (h < (ctxInfo.flowers ? 0.03 : 0.0018)) return sp[Math.floor(U.hash(x, y, seed + 4) * sp.length)];
        return pick3(pal, v);
      }
      case 'moss': {
        n = U.fbm(x / 16, y / 16, seed, 3);
        v = n + b * 0.2;
        if (h < 0.006) return sp[Math.floor(U.hash(x, y, seed + 4) * sp.length)];
        if (U.hash(x, y, seed + 9) < 0.03) return pal[2];
        return pick3(pal, v);
      }
      case 'dirt': case 'gravel': case 'coal': {
        n = U.fbm(x / 18, y / 18, seed, 3);
        v = n + b * 0.16;
        const pb = def.style === 'gravel' ? 0.05 : def.style === 'coal' ? 0.02 : 0.008;
        if (h < pb) return sp[0];
        if (U.hash(x, y + 1, seed) < pb) return pal[2];
        return pick3(pal, v);
      }
      case 'desert': case 'scrub': {
        n = U.fbm(x / 30, y / 30, seed, 3);
        v = n + b * 0.14;
        const cr = U.noise(x / 9, y / 9, seed + 7);
        if (Math.abs(cr - 0.5) < 0.022) return sp[0];
        if (def.style === 'scrub' && U.fbm(x / 7, y / 7, seed + 11, 2) > 0.7) return h < 0.5 ? sp[0] : U.hex('#5f7f3a');
        if (h < 0.003) return sp[sp.length - 1];
        return pick3(pal, v);
      }
      case 'salt': {
        n = U.fbm(x / 26, y / 26, seed, 2);
        v = n + b * 0.12;
        const c1 = U.noise(x / 11, y / 11, seed + 7), c2 = U.noise(x / 11 + 40, y / 11, seed + 8);
        if (Math.abs(c1 - 0.5) < 0.02 || Math.abs(c2 - 0.5) < 0.02) return sp[0];
        if (h < 0.006) return sp[1];
        return pick3(pal, v);
      }
      case 'coffee': {
        const row = y % 8;
        if (row >= 6) return U.hex(row === 6 ? '#4a3626' : '#5c4430');
        const bump = U.hash(Math.floor(x / 3), Math.floor(y / 8), seed);
        if (row === 0 && bump < 0.5) return U.hex('#5c4430');
        n = U.noise(x / 4, y / 4, seed);
        if (h < 0.02) return sp[0];
        return row < 2 ? pal[2] : n > 0.5 ? pal[1] : pal[0];
      }
      case 'brick': {
        const row = Math.floor(y / 4), off = (row % 2) * 4;
        if (y % 4 === 3 || (x + off) % 8 === 7) return pal[0];
        const bh = U.hash(Math.floor((x + off) / 8), row, seed);
        const base = bh < 0.33 ? pal[1] : bh < 0.8 ? pal[2] : pal[1];
        if ((x + off) % 8 === 0 && y % 4 === 0) return pal[2];
        return base;
      }
      case 'tiles': {
        const gx = x % 8, gy = y % 8;
        if (gx === 7 || gy === 7) return U.hex(U.shade(def.c[0], -0.12));
        const cx = Math.floor(x / 8), cy = Math.floor(y / 8);
        const wave = (cx % 4 === 0 && cy % 4 === 0) ? pal[2] : (cx % 4 === 2 && cy % 4 === 2) ? pal[3] : null;
        if (wave && gx > 0 && gy > 0 && gx < 6 && gy < 6 && Math.abs(gx - 3) + Math.abs(gy - 3) < 4) return wave;
        return (cx + cy) % 2 ? pal[0] : pal[1];
      }
      case 'stone': case 'mossstone': {
        const cs = 6, cx = Math.floor(x / cs), cy = Math.floor(y / 5);
        let f1 = 99, f2 = 99, id = 0;
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
          const px = (cx + i) * cs + U.hash(cx + i, cy + j, seed) * cs, py = (cy + j) * 5 + U.hash(cx + i, cy + j, seed + 1) * 5;
          const d = Math.hypot(x - px, (y - py) * 1.2);
          if (d < f1) { f2 = f1; f1 = d; id = U.hash(cx + i, cy + j, seed + 2); } else if (d < f2) f2 = d;
        }
        if (f2 - f1 < 1.1) return U.hex(U.shade(def.c[0], -0.3));
        return id < 0.33 ? pal[0] : id < 0.66 ? pal[1] : pal[2];
      }
      case 'concrete': case 'pavement': {
        const s = def.style === 'concrete' ? 16 : 8;
        if (x % s === 0 || y % s === 0) return U.hex(U.shade(def.c[0], -0.15));
        n = U.noise(x / 6, y / 6, seed);
        if (h < 0.01) return pal[0];
        return n + b * 0.2 > 0.55 ? pal[2] : pal[1];
      }
      case 'planks': {
        const row = Math.floor(y / 4);
        if (y % 4 === 3) return U.hex(U.shade(def.c[0], -0.35));
        const off = Math.floor(U.hash(row, 0, seed) * 24);
        if ((x + off) % 24 === 0) return U.hex(U.shade(def.c[0], -0.35));
        if ((x + off) % 24 === 2 && y % 4 === 1) return U.hex('#3a2a22');
        n = U.noise(x / 9, y * 1.5, seed);
        return n > 0.62 ? pal[2] : n < 0.38 ? pal[0] : pal[1];
      }
      case 'octagon': {
        const ci = ctxInfo.center || { x: 0, y: 0 };
        const dx = Math.abs(x - ci.x), dy = Math.abs(y - ci.y);
        const d = Math.max(dx, dy, (dx + dy) * 0.72);
        const ring = Math.floor(d / 6);
        if (d % 6 < 1) return U.hex(U.shade(def.c[0], -0.18));
        if (ring % 5 === 2) return pal[2];
        if (ring % 5 === 4) return pal[3];
        return ring % 2 ? pal[0] : pal[1];
      }
      case 'arabesque': {
        const lx = (x % 16) - 7.5, ly = (y % 16) - 7.5;
        const ax = Math.abs(lx), ay = Math.abs(ly);
        if (Math.max(ax, ay) < 3.2 || ax + ay < 4.5) return ((Math.floor(x / 16) + Math.floor(y / 16)) % 2) ? pal[2] : pal[3];
        if (ax > 7 || ay > 7) return U.hex(U.shade(def.c[0], -0.15));
        if (Math.abs(ax - ay) < 0.6) return U.hex(U.shade(def.c[0], -0.1));
        return pal[(Math.floor(x / 16) + Math.floor(y / 16)) % 2];
      }
      case 'kanas': {
        const lx = Math.abs((x % 16) - 7.5), ly = Math.abs((y % 16) - 7.5);
        const d = lx + ly;
        const cell = (Math.floor(x / 16) + Math.floor(y / 16) * 3) % 3;
        if (d > 13.5) return U.hex(U.shade(def.c[0], -0.12));
        if (d < 3) return pal[2 + cell];
        if (d > 6 && d < 8) return pal[2 + ((cell + 1) % 3)];
        return pal[(Math.floor(x / 16) + Math.floor(y / 16)) % 2];
      }
      case 'marble': {
        if (x % 16 === 0 || y % 16 === 0) return U.hex(U.shade(def.c[0], -0.12));
        const vein = U.fbm(x / 14, y / 10, seed, 3);
        if (Math.abs(vein - 0.5) < 0.018) return U.hex('#b8aec0');
        return vein + b * 0.1 > 0.55 ? pal[2] : pal[1];
      }
      default: {
        n = U.fbm(x / 20, y / 20, seed, 2);
        return pick3(pal, n + b * 0.15);
      }
    }
  }

  function cliffColor(cl, role, x, y, seed, lx, ly) {
    const top = cl._t || (cl._t = rgbPal(cl.top));
    const face = cl._f || (cl._f = rgbPal(cl.face));
    const b = BAYER[(y & 3) * 4 + (x & 3)];
    if (role === 'top') {
      const n = U.fbm(x / 16, y / 16, seed + 31, 2);
      if (cl.style === 'seawall' || cl.style === 'wall') {
        if (ly % 8 === 7 || (lx + (Math.floor(y / 8) % 2) * 8) % 16 === 15) return U.hex(U.shade(cl.top[0], -0.2));
      }
      if (U.hash(x, y, seed + 40) < 0.02) return top[2];
      return pick3(top, n + b * 0.18);
    }
    // Cara frontal.
    const st = cl.style;
    if (st === 'seawall' || st === 'wall') {
      const row = Math.floor(y / 6), off = (row % 2) * 6;
      if (y % 6 === 5 || (x + off) % 12 === 11) return face[0];
      const hh = U.hash(Math.floor((x + off) / 12), row, seed);
      return hh < 0.3 ? face[1] : face[2];
    }
    if (st === 'saltpile') return pick3(face, U.noise(x / 3, y / 9, seed) + b * 0.25);
    let n = U.noise(x / 2.5, y / 16, seed + 5) * 0.7 + U.noise(x / 9, y / 30, seed + 6) * 0.3;
    if (st === 'strata' || st === 'mesa' || st === 'redcliff' || st === 'dunecliff') {
      const band = Math.sin((y + U.noise(x / 20, 0, seed) * 8) * 0.55);
      n = n * 0.6 + (band * 0.5 + 0.5) * 0.4;
    }
    if (st === 'mossrock' || st === 'mountain' || st === 'rock') {
      const drip = U.hash(x, 0, seed + 50) * 9 + 2;
      if (role === 'face' && ly < drip && st !== 'rock') return top[(ly + x) % 2 ? 0 : 1];
    }
    return pick3(face, n + b * 0.2);
  }

  // Construye las capas estáticas de un mapa.
  T.build = function (grid, biome, seed) {
    const rows = grid.length, cols = grid[0].length;
    const Wd = cols * TS, Ht = rows * TS;
    const at = (x, y) => (x < 0 || y < 0 || x >= cols || y >= rows ? '#' : grid[y][x]);
    const atW = (x, y) => (x < 0 || y < 0 || x >= cols || y >= rows ? '~' : grid[y][x]);

    // Rol de cada acantilado: superficie, cara (1 o 2 filas) para la perspectiva ¾.
    const role = [];
    for (let y = 0; y < rows; y++) {
      role.push([]);
      for (let x = 0; x < cols; x++) {
        if (at(x, y) !== '#') { role[y].push(null); continue; }
        const b1 = y + 1 < rows ? grid[y + 1][x] : '#';
        const b2 = y + 2 < rows ? grid[y + 2][x] : '#';
        const a1 = y > 0 ? grid[y - 1][x] : '#';
        if (b1 !== '#') role[y].push('face');
        else if (b2 !== '#' && a1 === '#' && y + 1 < rows) role[y].push('face2');
        else role[y].push('top');
      }
    }

    // Centro de la plaza (para patrones radiales).
    let pcx = 0, pcy = 0, pn = 0;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (grid[y][x] === ':') { pcx += x; pcy += y; pn++; }
    const center = pn ? { x: (pcx / pn) * TS + 8, y: (pcy / pn) * TS + 8 } : { x: 0, y: 0 };

    }
    if (acc.includes('lance')) {
      g.r(19, 6 + hy, 1, 23, '#b9c4cc'); g.r(19, 6 + hy, 1, 23 - 12, '#dfe7ec');
      g.r(18, 3 + hy, 3, 3, '#e9eef2'); g.p(19, 4 + hy, '#2fb3a8');
      const a = f % 2;
      if (a) { g.r(16, 4 + hy, 2, 1, '#fff'); g.r(21, 4 + hy, 2, 1, '#fff'); g.r(19, 0 + hy, 1, 3, '#fff'); }
      else { g.r(17, 2 + hy, 1, 2, '#fff'); g.r(21, 2 + hy, 1, 2, '#fff'); g.r(19, 6 + hy, 1, 2, '#fff'); }
    }

      g.r(6, 9 + b, 12, 1, '#9a6236'); g.r(6, 21 + b, 12, 1, '#9a6236');

  function drawSide(g, s, f) {
    const ph = [0, 1, 0, -1][f], b = ph ? -1 : 0;

    const dress = s.outfit === 'dress' || s.outfit === 'robe';

    if (acc.includes('loom')) {

    legs.forEach(([o, c]) => {

    if (acc.includes('bag')) { g.r(8, 20 + b, 3, 5, '#c2457a'); g.p(9, 22 + b, '#f2c14e'); }
    // Brazo cercano.

    g.r(hx, 20 + b, 2, 2, s.outfit === 'robe' ? top : tD);

    // Cabeza de perfil.
    g.r(8, 6 + b, 9, 9, skin);
    g.r(16, 8 + b, 1, 6, sL);
    g.p(17, 11 + b, skin); g.p(17, 12 + b, sD);
    g.r(9, 14 + b, 7, 1, sD);
    g.r(11, 15 + b, 2, 1, sD);
    const eye = s.waxed ? '#efe6d2' : (s.eye || '#1f1614');

    g.p(14, 12 + b, s.waxed ? '#e8dcc8' : U.mix(skin, '#ff7b8a', 0.35));
    if (s.beard) { g.r(10, 13 + b, 7, 2, s.beard); }
    if (acc.includes('glasses')) { g.r(13, 10 + b, 3, 1, '#2a2a3a'); g.r(10, 10 + b, 3, 1, '#2a2a3a'); }
    const st = s.hairStyle;
    if (st !== 'bald') {
      g.r(8, 3 + b, 9, 4, hair); g.r(7, 5 + b, 5, 9, hair); g.r(12, 6 + b, 5, 1, hair);
      g.r(9, 3 + b, 5, 1, hL);
      g.r(10, 9 + b, 2, 3, skin); // oreja
      g.p(10, 10 + b, sD);
      if (st === 'long' || st === 'bob') g.r(7, 13 + b, 4, 2, hair);
      if (st === 'curly') [[8, 2], [11, 2], [14, 3]].forEach(([x, y]) => g.r(x, y + b, 2, 1, hair));
      if (st === 'bun') g.r(7, 1 + b, 5, 3, hair);
    } else { g.r(7, 7 + b, 2, 4, s.hair); g.r(10, 9 + b, 2, 3, skin); }
    if (s.hat) {

      else if (s.hatStyle === 'crown') { g.r(8, 1 + b, 9, 4, hc); [8, 11, 14].forEach(x => g.p(x, 0 + b, lighter(hc, 0.3))); }
      else if (s.hatStyle === 'turban') { g.r(7, 1 + b, 11, 6, hc); g.r(7, 3 + b, 11, 1, hcD); }
      else { g.r(4, 6 + b, 16, 2, hc); g.r(4, 7 + b, 16, 1, hcD); g.r(8, 1 + b, 9, 5, hc); g.r(8, 4 + b, 9, 1, s.hatBand || '#3a2418'); }
    }
    if (acc.includes('goggles')) { g.r(7, 6 + b, 10, 1, '#3a3346'); g.r(14, 5 + b, 3, 3, '#2a8f9c'); g.p(14, 5 + b, '#bff6ff'); }
    if (acc.includes('lance')) {
      g.r(hx + 2, 5 + b, 1, 24, '#b9c4cc');
      g.r(hx + 1, 2 + b, 3, 3, '#e9eef2'); g.p(hx + 2, 3 + b, '#2fb3a8');
      if (f % 2) { g.r(hx + 2, 0 + b, 1, 2, '#fff'); g.r(hx + 2, 5 + b, 1, 2, '#fff'); } else { g.r(hx - 1, 3 + b, 2, 1, '#fff'); g.r(hx + 4, 3 + b, 2, 1, '#fff'); }

    if (acc.includes('staff')) { g.r(hx + 2, 4 + b, 1, 25, '#7a4a2a'); g.r(hx + 1, 3 + b, 3, 2, '#e9c46a'); }
    if (acc.includes('megaphone')) { g.r(17, 15 + b, 4, 3, '#efe6d2'); g.r(21, 14 + b, 2, 5, '#f7f1e3'); }
  }

  // Construye las 16 imágenes de un personaje.
  function build(spec) {
    const frames = { down: [], up: [], right: [], left: [] };

        const c = U.makeCanvas(FW, FH);
        fn(P.painter(c.ctx), spec, f, back);
        return P.outline(c, spec.outline || P.OUT);
      };
      frames.down.push(mk(drawFront, false));
      frames.up.push(mk(drawFront, true));
      const side = mk(drawSide);
      frames.right.push(side);
      frames.left.push(P.flip(side));
    }
    return { frames, w: FW, h: FH, spec };
  }

/* ── js/art/props.js ── */
/* Props procedurales: vegetación guajira, edificios por estilo, objetos interactivos y monumentos.
   Cada prop devuelve { img, ax, ay } con el ancla (ax, ay) en la base y opcionalmente cuadros de animación. */
window.W = window.W || {};

(function () {
  'use strict';
  const U = W.U, P = W.P;

  function cv(w, h) { const c = U.makeCanvas(w, h); c.g = P.painter(c.ctx); return c; }
  function fin(c, ax, ay, extra) { return Object.assign({ img: P.outline(c), ax, ay, w: c.width, h: c.height }, extra || {}); }

  // Esfera sombreada para copas de árboles y arbustos (luz desde arriba a la izquierda).
  function blob(g, cx, cy, r, ramp, rnd) {
    g.circle(cx + 1, cy + 1, r, ramp[0]);
    g.circle(cx, cy, r, ramp[1]);
    g.circle(cx - Math.max(1, r * 0.25), cy - Math.max(1, r * 0.25), Math.max(1, r * 0.62), ramp[2]);
    if (r > 3) g.circle(cx - r * 0.4, cy - r * 0.45, Math.max(1, r * 0.25), ramp[3] || ramp[2]);
    if (rnd) for (let i = 0; i < r * 1.5; i++) {
      const a = rnd() * Math.PI * 2, d = rnd() * r;
      g.p(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rnd() < 0.5 ? ramp[0] : ramp[3] || ramp[2]);
    }
  }

  const PR = {};

  // ── Árboles ──
  PR.palm = function (seed, frame) {
    const r = U.rng(seed), c = cv(52, 62), g = c.g;
    const lean = r.range(-5, 5), H = r.int(36, 44);
    const bx = 26, by = 61;
    let tx = bx, ty = by;
    for (let i = 0; i <= H; i++) {
      const t = i / H;
      const x = bx + Math.sin(t * 1.6) * lean;
      const y = by - i;
      const w = 4 - Math.floor(t * 1.2);
      g.r(x - w / 2, y, w, 1, i % 4 === 0 ? '#6b4a30' : '#a07446');
      g.p(x - w / 2, y, '#c49460');
      tx = x; ty = y;
    }
    const sway = frame ? 0.08 : 0;
    const fronds = [-2.9, -2.35, -1.75, -1.2, -0.55, 0.05, 0.6, 2.45 + 0.3];
    fronds.forEach((a0, k) => {
      const a = a0 + sway * (k % 2 ? 1 : -1) + r.range(-0.1, 0.1);
      const L = r.int(15, 21);
      let px = tx, py = ty;
      for (let s = 1; s <= L; s++) {
        const t = s / L;
        const x = tx + Math.cos(a) * s, y = ty + Math.sin(a) * s + t * t * L * 0.55;
        g.line(px, py, x, y, '#2f6b35');
        const nx = -Math.sin(a), ny = Math.cos(a);
        const lw = Math.round((1 - t) * 4 + 1);
        if (s % 2 === 0) {
          g.line(x, y, x + nx * lw * 0.6 + Math.cos(a) * 1.5, y + ny * lw + 1.5, '#4f9a48');
          g.line(x, y, x - nx * lw * 0.6 + Math.cos(a) * 1.5, y - ny * lw * 0.3 + 2, '#3d8240');
        }
        px = x; py = y;
      }
    });
    g.circle(tx - 2, ty + 2, 2, '#6b4226'); g.circle(tx + 2, ty + 3, 2, '#7a4e2c'); g.p(tx - 3, ty + 1, '#a8774a');
    g.r(tx - 3, ty - 2, 6, 3, '#5a9a4a');
    return fin(c, bx, by, { solid: { x: -4, y: -5, w: 8, h: 5 } });
  };

  function broadleaf(seed, opts) {
    const r = U.rng(seed);
    const w = opts.w || 44, h = opts.h || 52;
    const c = cv(w, h), g = c.g;
    const bx = w / 2, by = h - 1;
    const th = opts.trunkH || 16;
    g.r(bx - 3, by - th, 6, th, opts.trunk[0]);
    g.r(bx - 3, by - th, 2, th, opts.trunk[1]);
    g.r(bx + 2, by - th, 1, th, U.shade(opts.trunk[0], -0.3));
    g.line(bx, by - th + 2, bx - 7, by - th - 5, opts.trunk[0]);
    g.line(bx + 1, by - th + 3, bx + 8, by - th - 4, opts.trunk[0]);
    if (opts.roots) { g.line(bx - 3, by, bx - 7, by - 1, opts.trunk[0]); g.line(bx + 3, by, bx + 7, by - 1, opts.trunk[0]); }
    const ramp = opts.leaves;
    const cy = by - th - (opts.canopyH || 12);
    const blobs = opts.blobs || 7;
    const pts = [];
    for (let i = 0; i < blobs; i++) {
      const a = (i / blobs) * Math.PI * 2 + r.range(-0.3, 0.3);
      const d = r.range(0.4, 1) * (opts.spread || 11);
      pts.push([bx + Math.cos(a) * d * 1.25, cy + Math.sin(a) * d * 0.75, r.int(opts.rMin || 6, opts.rMax || 9)]);
    }
    pts.push([bx, cy - 3, (opts.rMax || 9) + 1]);
    pts.sort((a, b) => a[1] - b[1]);
    pts.forEach(p => blob(g, p[0], p[1], p[2], ramp, r));
    if (opts.flowers) for (let i = 0; i < (opts.flowerN || 26); i++) {
      const a = r() * Math.PI * 2, d = r() * 15;
      const x = bx + Math.cos(a) * d * 1.2, y = cy + Math.sin(a) * d * 0.7;
      g.p(x, y, r.pick(opts.flowers)); if (r() < 0.4) g.p(x + 1, y, r.pick(opts.flowers));
    }
    if (opts.moss) { for (let i = 0; i < 6; i++) g.p(bx - 3 + r.int(0, 5), by - r.int(1, th), '#8fd07a'); }
    if (opts.lianas) for (let i = 0; i < 4; i++) { const x = bx + r.int(-12, 12); g.vl(x, cy + 4, r.int(8, 16), '#3f6a3a'); }
    if (opts.brom) for (let i = 0; i < 4; i++) { const x = bx + r.int(-10, 10), y = cy + r.int(-6, 6); g.r(x, y, 2, 2, '#e05a7a'); g.p(x, y - 1, '#ff9ec7'); }
    return fin(c, bx, by, { solid: { x: -4, y: -5, w: 8, h: 5 } });

  PR.building = function (style, wT, hT, seed) {

    // Fachada

      g.r(0, fy, W0, fh, '#a07446');

    } else {

      const aw = [['#e63946', '#f3ead8'], ['#2a9d8f', '#f3ead8'], ['#f2c14e', '#c2457a'], ['#3d6fb6', '#f2c14e']][r.int(0, 3)];
      const ay = fy + fh - 15;

      g.r(door, fy + fh - 12, dw, 12, style === 'campus' ? '#3a6a8a' : style === 'wax' ? '#d9ccb4' : '#7a4a2a');
      g.r(door, fy + fh - 12, dw / 2, 12, style === 'campus' ? '#5a9aba' : style === 'wax' ? '#e9dfcc' : '#8f5a34');
      g.p(door + dw - 2, fy + fh - 6, '#e9c46a');

/* Criaturas de la Cera Gris: enemigos comunes, mini-jefes y Jefes Finales de Cera.
   Paleta de cera marfil con acentos (llamas de pabilo, núcleos y ojos ámbar). */
window.W = window.W || {};

(function () {
  'use strict';
  const U = W.U, P = W.P;
  const WX = ['#b8a684', '#d9ccb4', '#efe5cf', '#fffaf0']; // sombra, medio, base, brillo
  const EYE = '#3a2438', GLOW = '#ffb54a';

  function cv(w, h) { const c = U.makeCanvas(w, h); c.g = P.painter(c.ctx); return c; }
  function done(c) { return P.outline(c, '#4a3a3e'); }

  function drips(g, x0, x1, y, r, n) {
    for (let i = 0; i < n; i++) { const x = x0 + Math.floor(r() * (x1 - x0)); const L = 2 + Math.floor(r() * 5); g.r(x, y, 2, L, WX[2]); g.p(x, y + L, WX[1]); g.p(x + 1, y, WX[3]); }
  }
  function flame(g, x, y, f) {
    g.r(x - 1, y - 4 - f, 3, 4 + f, '#ff8a2a'); g.r(x, y - 3 - f, 1, 3 + f, '#ffe066'); g.p(x, y - 5 - f, '#ff5a2a');
  }
  function eyes(g, x1, x2, y, angry) {
    g.r(x1, y, 3, 2, EYE); g.r(x2, y, 3, 2, EYE); g.p(x1 + 1, y, GLOW); g.p(x2 + 1, y, GLOW);
    if (angry) { g.line(x1 - 1, y - 2, x1 + 2, y - 1, EYE); g.line(x2 + 3, y - 2, x2, y - 1, EYE); }
  }
  function bigEyes(g, cx, y) { // cuencas oscuras con pupilas ámbar encendidas
    g.r(cx - 7, y - 1, 5, 4, EYE); g.r(cx + 2, y - 1, 5, 4, EYE);
    g.r(cx - 6, y, 2, 2, GLOW); g.r(cx + 4, y, 2, 2, GLOW); g.p(cx - 6, y, '#fff3c0'); g.p(cx + 4, y, '#fff3c0');
    g.line(cx - 8, y - 3, cx - 3, y - 1, EYE); g.line(cx + 7, y - 3, cx + 2, y - 1, EYE);
  }

  const EN = {};

  // ── Enemigos comunes (2 cuadros) ──
  const MINIONS = {
    pregonero(g, f, r) { // Pregonero de Pabilo: vela con megáfono que grita rumores
      g.r(8, 10 + f, 12, 18, WX[2]); g.r(8, 10 + f, 3, 18, WX[3]); g.r(17, 10 + f, 3, 18, WX[1]);
      drips(g, 8, 19, 10 + f, r, 4); g.r(13, 6 + f, 1, 4, '#3a2a2a'); flame(g, 13, 6 + f, f);
      eyes(g, 9, 15, 15 + f, true); g.r(11, 21 + f, 6, 2, EYE);
      g.r(20, 16 + f, 4, 4, WX[1]); g.r(24, 14 + f, 3, 8, WX[3]); g.p(26, 14 + f, WX[1]);
      g.r(9, 28, 4, 2, WX[0]); g.r(15, 28, 4, 2, WX[0]);

    gaviota(g, f) { // Gaviota de Estearina

      if (f) { g.line(10, 14, 2, 8, WX[2]); g.line(11, 15, 3, 9, WX[1]); g.line(16, 14, 24, 6, WX[2]); }
      else { g.line(10, 16, 2, 20, WX[2]); g.line(11, 17, 3, 21, WX[1]); g.line(16, 16, 24, 22, WX[2]); }

    cangrejo(g, f) { // Cangrejo de Parafina

  function humanoid(g, W0, H0, f, o, r) {
    const cx = W0 / 2, base = H0 - 2, b = f;
    const bodyW = o.bodyW || 30, bodyH = o.bodyH || 36;
    const top = base - bodyH;
    for (let y = 0; y < bodyH; y++) {
      const w = Math.round(bodyW / 2 + y * (o.flare || 0.18));
      g.r(cx - w, top + y + b, w * 2, 1, WX[2]);
      g.r(cx - w, top + y + b, Math.max(2, w * 0.35), 1, WX[3]);
      g.r(cx + w - Math.max(2, w * 0.3), top + y + b, Math.max(2, w * 0.3), 1, WX[1]);
    }
    for (let x = -bodyW / 2 + 4; x < bodyW / 2 - 2; x += 6) for (let y = 6; y < bodyH - 2; y++) if ((y + x) % 7 < 5) g.p(cx + x + Math.round(y * (o.flare || 0.18) * (x / bodyW)), top + y + b, WX[1]);
    for (let y = 0; y < bodyH; y++) { const w = Math.round(bodyW / 2 + y * (o.flare || 0.18)); g.r(cx + w - 2, top + y + b, 2, 1, WX[0]); }
    if (o.trim) for (let x = -bodyW / 2 - 4; x < bodyW / 2 + 4; x += 2) { g.p(cx + x, base - 6 + b, o.trim); g.p(cx + x + 1, base - 5 + b, o.trim); }
    drips(g, cx - bodyW / 2, cx + bodyW / 2, top + b, r, 7);
    const hr = o.headR || 9, hy = top - hr + 2 + b;
    g.circle(cx, hy, hr, WX[1]); g.circle(cx - 1, hy - 1, hr - 1, WX[2]); g.circle(cx - 3, hy - 3, hr - 4, WX[3]);
    g.r(cx - hr + 2, hy + 1, hr * 2 - 4, Math.max(2, hr - 4), WX[1]);
    bigEyes(g, cx, hy);
    for (let x = -4; x <= 4; x += 2) { g.p(cx + x, hy + 5, EYE); g.p(cx + x + 1, hy + 6, EYE); }
    g.r(cx - 5, hy + 5, 11, 1, EYE);
    // brazos
    const armY = top + 8 + b;
    g.r(cx - bodyW / 2 - 7, armY, 7, 16, WX[1]); g.r(cx + bodyW / 2, armY, 7, 16, WX[1]);
    g.r(cx - bodyW / 2 - 7, armY, 2, 16, WX[3]);
    return { cx, hy, hr, armY, top: top + b, base, bodyW };
  }
